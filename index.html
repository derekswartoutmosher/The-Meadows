<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Meadows</title>
<meta name="theme-color" content="#2f4a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Meadows">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#2f4a3a; --pine-dark:#243a2d; --cream:#f4eedc; --cream-2:#ebe3cc; --wood:#6b4a2b; --wood-light:#a07c55;
  --ink:#2a2a24; --line:rgba(107,74,43,.25);
  --head:'Playfair Display',Georgia,serif; --body:'Lora',Georgia,serif; --script:'Caveat',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--pine);color:var(--cream);text-align:center;padding:calc(22px + env(safe-area-inset-top)) 16px 18px}
.wordmark{font-family:var(--script);font-size:46px;line-height:1;margin:0;letter-spacing:.5px}
.tag{font-style:italic;font-size:13px;opacity:.8;margin-top:4px}
main{max-width:640px;margin:0 auto;padding:18px 16px}
h2{font-family:var(--head);font-weight:600;font-size:24px;color:var(--pine);margin:0 0 4px}
.sub{color:var(--wood);font-style:italic;font-size:14px;margin:0 0 16px}
.card{background:#fbf8ee;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label.small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood);margin-bottom:4px}
input,select{font-family:var(--body);font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
button{font-family:var(--body);cursor:pointer}
.btn{background:var(--pine);color:var(--cream);border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:500}
.btn:active{background:var(--pine-dark)}
.btn.ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.btn.danger{background:transparent;color:#8a3b2a;border:1px solid #8a3b2a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.row > .fit{flex:0 0 auto}
.stack > * + *{margin-top:12px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--pine);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--cream);opacity:.6;padding:14px 4px 12px;font-family:var(--head);font-size:15px;letter-spacing:.02em;border-top:3px solid transparent}
nav button.on{opacity:1;border-top-color:var(--cream)}

/* players */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--cream-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip button{background:none;border:0;color:var(--wood);font-size:18px;line-height:1;padding:0 4px}

/* hole pager */
.pager{display:flex;gap:6px;margin-bottom:12px}
.pager button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:#fbf8ee;color:var(--pine);font-family:var(--head);font-size:16px;position:relative}
.pager button.on{background:var(--pine);color:var(--cream);border-color:var(--pine)}
.pager button.done::after{content:'';position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--wood-light)}
.pager button.on.done::after{background:var(--cream)}
.holehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.holehead .t{font-family:var(--head);font-size:22px;color:var(--pine)}
.holehead .m{color:var(--wood);font-size:14px}
.fox{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--wood);color:var(--cream);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.prow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tot{font-size:13px;color:var(--wood)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--pine);background:#fff;color:var(--pine);font-size:24px;line-height:1}
.step button:active{background:var(--cream-2)}
.step .v{width:40px;text-align:center;font-family:var(--head);font-size:26px;color:var(--pine)}
.step .v.empty{color:var(--wood-light)}
.navrow{display:flex;gap:8px;margin-top:12px}
.navrow .btn{flex:1}

/* scores */
.pm{font-family:var(--head);font-weight:600}
.pm.under{color:#2a6a45}.pm.over{color:#8a3b2a}.pm.even{color:var(--pine)}

/* leaderboard */
.seg{display:flex;border:1px solid var(--pine);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;background:transparent;border:0;color:var(--pine);padding:9px;font-size:14px}
.seg button.on{background:var(--pine);color:var(--cream)}
.lb{background:#fbf8ee;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lbr{width:100%;display:flex;align-items:center;gap:12px;padding:14px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit}
.lbr:first-child{border-top:0}
.rank{width:26px;font-family:var(--head);font-size:18px;color:var(--wood);text-align:center}
.lbr .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .dt{display:block;font-weight:400;font-size:12px;color:var(--wood)}
.lbr .sc{font-family:var(--head);font-size:22px;min-width:44px;text-align:right}
.chev{color:var(--wood-light);transition:transform .15s}
.lbr.open .chev{transform:rotate(90deg)}
.detail{background:var(--cream-2);padding:14px;border-top:1px solid var(--line)}
.detail .meta{font-size:14px;color:var(--wood);margin-bottom:10px}
table{width:100%;border-collapse:collapse;text-align:center;font-size:15px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood);font-weight:500;padding:2px 0 6px}
td{padding:6px 0;border-top:1px solid var(--line)}
td.s{font-family:var(--head);font-weight:600;font-size:17px}
.cell{display:inline-block;min-width:30px;height:30px;line-height:28px;border:1.5px solid transparent}
.cell.birdie{border-color:#2a6a45;border-radius:50%;color:#2a6a45}
.cell.eagle{border-color:#2a6a45;border-radius:50%;box-shadow:0 0 0 2px var(--cream-2),0 0 0 3.5px #2a6a45;color:#2a6a45}
.cell.bogey{border-color:#8a3b2a;color:#8a3b2a}
.cell.dbl{border-color:#8a3b2a;color:#8a3b2a;box-shadow:0 0 0 2px var(--cream-2),0 0 0 3.5px #8a3b2a}
.detail .acts{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--wood)}
.empty-state{text-align:center;padding:36px 16px;color:var(--wood);font-style:italic}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:#fbf8ee;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--head);font-size:22px;color:var(--pine)}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood)}

.pagelogo{text-align:center;margin:0 0 8px}
.pagelogo img{width:120px;height:auto}

/* printed-style card */
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px 10px;margin-bottom:14px}
.cardhead{display:flex;align-items:center;gap:10px}
.cardlogo{width:50px;height:auto;flex:0 0 auto}
.cardtitle{font-family:var(--script);font-size:30px;line-height:1;color:var(--pine);white-space:nowrap}
.cardsub{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--wood);white-space:nowrap;margin-top:2px}
.carddate{margin-left:auto;text-align:right;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--wood);border-bottom:1.5px solid var(--ink);padding:14px 0 2px;min-width:72px;flex:0 0 auto}
.carddate b{display:block;font-size:12px;white-space:nowrap;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500}
.rule2{height:5px;border-top:2px solid var(--pine);border-bottom:1.5px solid #b8913f;margin:10px 0 12px}
.cardscroll{overflow-x:auto}
.ptab{width:100%;min-width:330px;border-collapse:collapse;text-align:center;table-layout:fixed}
.ptab col.nm{width:27%}.ptab col.tt{width:13%}
.ptab th,.ptab td{border:0;padding:0}
.ptab .ch th{background:var(--pine);color:var(--cream);font-family:var(--head);font-weight:700;font-size:18px;padding:7px 0;letter-spacing:0;text-transform:none}
.ptab .ch th.lab{font-family:var(--body);font-weight:400;font-size:9px;letter-spacing:.16em;text-transform:uppercase;text-align:left;padding-left:8px}
.ptab .cy td,.ptab .cp td.par{font-family:var(--head);font-size:17px;color:var(--pine);padding:6px 0;border-top:1px solid var(--line)}
.ptab .cy td{background:#faf6ea}.ptab .cpar td{background:var(--cream);font-family:var(--head);font-size:17px;color:var(--pine);padding:6px 0;border-top:1px solid var(--line)}
.ptab td.lab{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--wood);text-align:left;padding-left:8px;font-family:var(--body)}
.ptab td.tt{background:var(--cream);font-family:var(--head);font-weight:600;font-size:17px}
.ptab .cplayer td{border-top:1px solid var(--line);height:46px;vertical-align:middle}
.ptab td.pn{text-align:left;padding:2px 6px 2px 8px;border-right:1px solid var(--line)}
.ptab td.pn b{display:block;font-size:13px;line-height:1.2;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab td.pn small{display:block;font-size:10px;color:var(--wood);letter-spacing:.06em;text-transform:uppercase}
.ptab td.sc{border-left:1px solid var(--line)}
.ptab td.sc.cur{background:rgba(47,74,58,.07)}
.ptab td.sc button{width:100%;height:44px;background:none;border:0;font-family:var(--head);font-weight:600;font-size:18px;color:var(--ink)}
.cardfoot{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;font-style:italic;color:var(--wood)}
.cardfoot span:last-child{font-style:normal;letter-spacing:.14em;text-transform:uppercase;font-size:9.5px}

/* guide */
.jump{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;background:#fbf8ee;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--pine)}
.gcover{text-align:center;padding:4px 0 6px}
.gcover img{width:58%;max-width:240px;height:auto}
.gcover .gs{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--wood);margin-top:6px}
.gcover .gt{font-style:italic;color:var(--wood);font-size:14px;margin-top:6px}
.gsec{scroll-margin-top:12px;margin-top:30px}
.gsec h2{font-family:var(--script);font-size:38px;font-weight:700;line-height:1;margin:0}
.gsec .gk{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--wood);margin:4px 0 0}
.gsec .rule2{margin:12px 0 14px}
.gq{font-family:var(--head);font-style:italic;font-size:25px;line-height:1.25;color:var(--pine);margin:0 0 12px}
.gsec h3{font-family:var(--head);font-weight:700;font-size:19px;color:var(--pine);margin:18px 0 4px}
.gsec p{margin:0 0 10px}
.gtab{width:100%;border-collapse:collapse;text-align:center;margin:4px 0 10px}
.gtab th{background:var(--pine);color:var(--cream);font-family:var(--head);font-weight:700;font-size:17px;padding:8px 0;letter-spacing:0;text-transform:none}
.gtab th:first-child,.gtab td:first-child{text-align:left;padding-left:10px;font-family:var(--body);font-weight:400;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.gtab td{background:#faf6ea;border-top:1px solid var(--line);font-family:var(--head);font-size:18px;color:var(--pine);padding:8px 0}
.gtab td:first-child{color:var(--wood)}
.gtab tr:nth-child(3) td{background:var(--cream)}
.gtab td.tt,.gtab th.tt{background:var(--cream-2);font-weight:600}
.gtab th.tt{background:var(--pine)}
.mapimg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-top:10px}
.key i{display:inline-block;vertical-align:-1px;margin-right:6px;font-style:normal}
.k-tee{width:11px;height:11px;background:var(--pine)}
.k-green{width:12px;height:12px;border:2px solid var(--pine);border-radius:50%}
.k-haz{width:16px;height:10px;background:#d6c08e;border:1.5px solid var(--wood);border-radius:50%}
.k-fw{width:20px;height:5px;background:#c3cdb6;border-radius:3px;vertical-align:2px!important}
.k-sl{width:20px;border-top:2px dashed var(--pine);vertical-align:3px!important}
.mapnotes{border-top:1.5px solid #b8913f;margin-top:14px;padding-top:10px;font-size:14px}
.mapnotes p{margin:0 0 4px!important}
.clubs{display:grid;gap:8px;margin:10px 0}
.club{background:#faf6ea;border:1px solid #d6cbae;padding:10px 14px}
.club b{font-family:var(--head);font-size:18px;color:var(--pine);display:block}
.club span{font-size:13.5px;color:#5c5a4d}
.note{border-left:4px solid #b8913f;background:#faf6ea;padding:12px 14px;margin:14px 0 0;font-size:15px}
.rules2{list-style:none;padding:0;margin:0}
.rules2 li{display:flex;gap:14px;margin-bottom:14px}
.rules2 .n{font-family:var(--head);font-size:20px;color:#b8913f;width:16px;flex:0 0 auto}
.gfoot{text-align:center;margin:34px 0 8px}
.gfoot img{width:90px;height:auto}
.gfoot div{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--pine);margin-top:6px}

/* course */
.holes td:first-child,.holes th:first-child{text-align:left;padding-left:4px}
.rules{padding-left:18px;margin:8px 0 0}
.rules li{margin-bottom:6px}
.safety{border-left:4px solid var(--wood);background:var(--cream-2);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--pine-dark);color:var(--cream);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1 class="wordmark">The Meadows</h1>
  <div class="tag">Six holes. One club. Plenty of banter.</div>
</header>
<main id="app"></main>
<nav>
  <button data-tab="guide">Guide</button>
  <button data-tab="play" class="on">Scorecard</button>
  <button data-tab="board">Leaderboard</button>
</nav>

<script>
(function(){
'use strict';

/* ---------- Course ---------- */
var HOLES = [
  {n:1, par:4, yd:54},
  {n:2, par:4, yd:75},
  {n:3, par:4, yd:65},
  {n:4, par:3, yd:49},
  {n:5, par:3, yd:59, fox:true},
  {n:6, par:4, yd:48, fox:true}
];
var TOTAL_PAR = HOLES.reduce(function(a,h){return a+h.par;},0); // 22
var CLUBS = ['Gap Wedge','Pitching Wedge','9-Iron','8-Iron'];
var MAX_PLAYERS = 8;

/* ---------- Live leaderboard (Supabase) ----------
   Paste your Project URL and public key from Supabase (Project Settings > API).
   Leave both empty to run without a database. */
var SUPABASE_URL = '';   // e.g. https://abcdefgh.supabase.co
var SUPABASE_KEY = '';   // anon public key (or publishable key)
var LIVE = !!(SUPABASE_URL && SUPABASE_KEY);

/* ---------- Storage ---------- */
var K_ROUNDS='meadows.rounds.v1', K_DRAFT='meadows.draft.v1';
function load(k,fb){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var localRounds = load(K_ROUNDS, []);
var remoteRounds = load('meadows.remote.v1', []);
var syncStatus = LIVE ? 'connecting' : 'off', adminPin = '', pinFor = null;
var sharedRounds = [];           // from rounds.json in the repo (read-only)
var draft = load(K_DRAFT, null) || newDraft();
var tab = 'play', boardMode = 'all', openId = null, confirmDel = null, confirmClear = false, confirmPartial = false;

function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function newDraft(){ return {date:today(), players:[], hole:0}; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtPM(n){ return n===0?'E':(n>0?'+'+n:String(n)); }
function pmClass(n){ return n<0?'under':(n>0?'over':'even'); }
function fmtDate(iso){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function allRounds(){
  var seen={}, out=[];
  localRounds.concat(remoteRounds, sharedRounds).forEach(function(r){ if(!seen[r.id]){seen[r.id]=1; out.push(r);} });
  return out;
}
function isLocal(id){ return localRounds.some(function(r){return r.id===id;}); }

/* ---------- Live sync ---------- */
function sb(path,opts){
  opts=opts||{};
  var h={apikey:SUPABASE_KEY}; for(var k in (opts.headers||{})) h[k]=opts.headers[k];
  return fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{method:opts.method||'GET',headers:h,body:opts.body});
}
function toRow(r){ return {id:r.id,round_id:r.roundId||null,name:r.name,date:r.date,club:r.club||null,scores:r.scores,par:r.par,to_par:r.toPar}; }
function fromRow(r){ return {id:r.id,roundId:r.round_id||'',name:r.name,date:r.date,club:r.club||'',scores:r.scores,par:r.par,toPar:r.to_par}; }
var syncing=false, resync=false;
function pushPending(){
  if(!localRounds.length) return Promise.resolve();
  var batch=localRounds.slice();
  return sb('rounds?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(batch.map(toRow))})
    .then(function(res){
      if(!res.ok) throw new Error('push '+res.status);
      var sent={}; batch.forEach(function(r){sent[r.id]=1;});
      localRounds=localRounds.filter(function(r){return !sent[r.id];}); save(K_ROUNDS,localRounds);
    });
}
function pullRemote(){
  return sb('rounds?select=*&order=date.desc&limit=1000')
    .then(function(res){ if(!res.ok) throw new Error('pull '+res.status); return res.json(); })
    .then(function(rows){ remoteRounds=rows.map(fromRow).filter(validRound); save('meadows.remote.v1',remoteRounds); syncStatus='ok'; });
}
function syncNow(){
  if(!LIVE) return Promise.resolve();
  if(syncing){ resync=true; return Promise.resolve(); }
  syncing=true;
  return pushPending().catch(function(){})
    .then(function(){ return pullRemote(); }).catch(function(){ syncStatus='offline'; })
    .then(function(){
      syncing=false;
      var typing=document.activeElement && document.activeElement.tagName==='INPUT';
      if(pinFor===null && !typing) render();
      if(resync){ resync=false; syncNow(); }
    });
}
function statusLine(){
  var t = syncStatus==='ok' ? 'Live \u00b7 synced' : syncStatus==='offline' ? 'Offline \u00b7 showing last synced scores' : 'Connecting\u2026';
  if(localRounds.length) t+=' \u00b7 '+localRounds.length+' waiting to sync';
  return '<p class="sub" style="margin:-8px 0 14px;font-size:13px">'+t+'</p>';
}
function deleteRemote(id){
  var inp=document.getElementById('pinIn'), pin=(inp?inp.value:'').trim();
  if(!pin){ toast('Enter the admin PIN'); return; }
  sb('rpc/delete_round',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_id:id,p_pin:pin})})
    .then(function(res){ if(!res.ok) throw new Error('rpc '+res.status); return res.json(); })
    .then(function(ok){
      if(ok===true){
        adminPin=pin;
        remoteRounds=remoteRounds.filter(function(r){return r.id!==id;}); save('meadows.remote.v1',remoteRounds);
        pinFor=null; openId=null; render(); toast('Round deleted');
      } else { adminPin=''; toast('Wrong PIN'); }
    })
    .catch(function(){ toast('Couldn\u2019t reach the leaderboard. Try again.'); });
}

/* ---------- Shared rounds from repo ---------- */
function loadShared(){
  fetch('rounds.json',{cache:'no-store'}).then(function(r){ return r.ok?r.json():[]; })
    .then(function(a){ if(Array.isArray(a)){ sharedRounds=a.filter(validRound); render(); } })
    .catch(function(){});
}
function validRound(r){
  return r && typeof r.id==='string' && typeof r.name==='string' && typeof r.date==='string' &&
    Array.isArray(r.scores) && r.scores.length===HOLES.length && r.scores.every(function(s){return typeof s==='number';});
}

/* ---------- Scoring ---------- */
function parThru(scores){ var p=0; scores.forEach(function(s,i){ if(s!=null) p+=HOLES[i].par; }); return p; }
function sumScores(scores){ return scores.reduce(function(a,s){return a+(s||0);},0); }
function toPar(scores){ return sumScores(scores)-parThru(scores); }
function complete(p){ return p.scores.every(function(s){return s!=null;}); }
function cellClass(s,par){
  var d=s-par;
  if(d<=-2) return 'eagle'; if(d===-1) return 'birdie'; if(d===1) return 'bogey'; if(d>=2) return 'dbl'; return '';
}

/* ---------- Actions ---------- */
function persistDraft(){ save(K_DRAFT,draft); }
function addPlayer(name){
  name=name.trim().replace(/\s+/g,' ');
  if(!name) return;
  if(draft.players.length>=MAX_PLAYERS){ toast('Up to '+MAX_PLAYERS+' players per round'); return; }
  if(draft.players.some(function(p){return p.name.toLowerCase()===name.toLowerCase();})){ toast(name+' is already on the card'); return; }
  draft.players.push({name:name, club:'', scores:HOLES.map(function(){return null;})});
  persistDraft(); render();
}
function bump(pi,delta){
  var p=draft.players[pi], h=draft.hole, par=HOLES[h].par, cur=p.scores[h];
  if(cur==null) cur=par; else cur=Math.min(12,Math.max(1,cur+delta));
  p.scores[h]=cur; persistDraft(); render();
}
function saveRound(){
  var done=draft.players.filter(complete), partial=draft.players.length-done.length;
  if(!done.length) return;
  if(partial && !confirmPartial){ confirmPartial=true; render(); toast(partial+' unfinished card'+(partial>1?'s':'')+' won\u2019t be saved. Tap again to continue.'); return; }
  confirmPartial=false;
  var roundId=uid();
  done.forEach(function(p){
    localRounds.push({id:uid(), roundId:roundId, name:p.name, date:draft.date, club:p.club||'', scores:p.scores.slice(), par:TOTAL_PAR, toPar:sumScores(p.scores)-TOTAL_PAR});
  });
  save(K_ROUNDS,localRounds);
  draft=newDraft(); persistDraft();
  tab='board'; boardMode='all'; openId=null; render();
  if(LIVE) syncNow();
  toast(done.length+' round'+(done.length>1?'s':'')+' added to the leaderboard');
}
function deleteRound(id){
  if(confirmDel!==id){ confirmDel=id; render(); return; }
  confirmDel=null;
  localRounds=localRounds.filter(function(r){return r.id!==id;});
  save(K_ROUNDS,localRounds); openId=null; render();
}
function exportRounds(){
  var blob=new Blob([JSON.stringify(allRounds().sort(byDate),null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='rounds.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importRounds(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var arr=JSON.parse(fr.result); if(!Array.isArray(arr)) throw 0;
      var have={}; allRounds().forEach(function(r){have[r.id]=1;});
      var added=0;
      arr.forEach(function(r){ if(validRound(r)&&!have[r.id]){ localRounds.push(r); have[r.id]=1; added++; } });
      save(K_ROUNDS,localRounds); render(); toast(added+' round'+(added===1?'':'s')+' imported');
    }catch(e){ toast('That file isn\u2019t a valid rounds file'); }
  };
  fr.readAsText(file);
}
function byDate(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }

function viewPlay(){
  var h=HOLES[draft.hole], names=allRounds().map(function(r){return r.name;});
  var known=names.filter(function(n,i){return names.indexOf(n)===i;});
  var html=PAGELOGO+'<h2>Scorecard</h2><p class="sub">Add the group, then score hole by hole.</p>';

  html+='<div class="card"><div class="row"><div><label class="small" for="dt">Date</label><input id="dt" type="date" value="'+esc(draft.date)+'"></div></div>'+
    '<div style="margin-top:12px"><label class="small" for="pn">Players ('+draft.players.length+'/'+MAX_PLAYERS+')</label>'+
    '<div class="row"><input id="pn" list="known" placeholder="Name" autocomplete="off" autocapitalize="words" maxlength="24"><button class="btn fit" id="addp">Add</button></div>'+
    '<datalist id="known">'+known.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist>';
  if(draft.players.length){
    html+='<div class="chips">'+draft.players.map(function(p,i){return '<span class="chip">'+esc(p.name)+'<button data-rm="'+i+'" aria-label="Remove '+esc(p.name)+'">\u00d7</button></span>';}).join('')+'</div>';
  }
  html+='</div></div>';

  if(!draft.players.length) return html+'<div class="empty-state" style="padding:18px 16px">No players yet. Add a name to start scoring.</div>'+cardHtml();

  html+='<div class="pager">'+HOLES.map(function(x,i){
    var d=draft.players.every(function(p){return p.scores[i]!=null;});
    return '<button data-hole="'+i+'" class="'+(i===draft.hole?'on ':'')+(d?'done':'')+'">'+x.n+'</button>';
  }).join('')+'</div>';

  html+='<div class="card"><div class="holehead"><span class="t">Hole '+h.n+(h.fox?'<span class="fox">Fox Run</span>':'')+'</span><span class="m">Par '+h.par+' \u00b7 '+h.yd+' yd</span></div>';
  draft.players.forEach(function(p,i){
    var v=p.scores[draft.hole], thru=p.scores.filter(function(s){return s!=null;}).length;
    html+='<div class="prow"><div class="who"><div class="nm">'+esc(p.name)+'</div><div class="tot">'+
      (thru?('Thru '+thru+' \u00b7 <span class="pm '+pmClass(toPar(p.scores))+'">'+fmtPM(toPar(p.scores))+'</span>'):'Not started')+'</div></div>'+
      '<div class="step"><button data-m="'+i+'" aria-label="Minus one">\u2212</button><span class="v'+(v==null?' empty':'')+'">'+(v==null?'\u2013':v)+'</span><button data-p="'+i+'" aria-label="Plus one">+</button></div></div>';
  });
  html+='<div class="navrow"><button class="btn ghost" id="prev"'+(draft.hole===0?' disabled':'')+'>Previous</button><button class="btn ghost" id="next"'+(draft.hole===HOLES.length-1?' disabled':'')+'>Next hole</button></div></div>';

  html+=cardHtml();
  html+='<div class="card"><label class="small">Club of the round</label>'+draft.players.map(function(p,i){
    return '<div class="row" style="margin-top:8px"><span style="flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</span>'+
      '<select data-club="'+i+'"><option value="">\u2014</option>'+CLUBS.map(function(c){return '<option'+(p.club===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>';
  }).join('')+'</div>';

  var nDone=draft.players.filter(complete).length;
  html+='<button class="btn block" id="saveR"'+(nDone?'':' disabled')+'>'+(confirmPartial?'Tap again to save anyway':'Save round to leaderboard'+(nDone?' ('+nDone+')':''))+'</button>'+
    '<p class="sub" style="text-align:center;margin-top:8px">'+(nDone?'Only completed cards are saved.':'Finish all six holes for at least one player to save.')+'</p>'+
    '<button class="btn danger block" id="clearD" style="margin-top:6px">'+(confirmClear?'Tap again to clear the card':'Start over')+'</button>';
  return html;
}

function detailTable(r){
  var head='<tr><th></th>'+HOLES.map(function(h){return '<th>'+h.n+'</th>';}).join('')+'<th>Tot</th></tr>';
  var par='<tr><td style="text-align:left;color:var(--wood);font-size:13px;border-top:0">Par</td>'+HOLES.map(function(h){return '<td style="border-top:0;color:var(--wood)">'+h.par+'</td>';}).join('')+'<td style="border-top:0;color:var(--wood)">'+TOTAL_PAR+'</td></tr>';
  var sc='<tr><td style="text-align:left;font-size:13px">Score</td>'+r.scores.map(function(s,i){return '<td class="s"><span class="cell '+cellClass(s,HOLES[i].par)+'">'+s+'</span></td>';}).join('')+'<td class="s">'+sumScores(r.scores)+'</td></tr>';
  return '<table>'+head+par+sc+'</table>';
}

function viewBoard(){
  var rounds=allRounds(), html=PAGELOGO+'<h2>All-Time Leaderboard</h2><p class="sub">Every round ever played at The Meadows.</p>';
  if(LIVE) html+=statusLine();
  if(!rounds.length) html+='<div class="empty-state">No rounds yet. Save a scorecard and it lands here.</div>';
  else{
    var players={}; rounds.forEach(function(r){players[r.name.toLowerCase()]=1;});
    var best=rounds.reduce(function(a,r){return r.toPar<a?r.toPar:a;},Infinity);
    html+='<div class="stats"><div class="stat"><b>'+rounds.length+'</b><span>Rounds</span></div><div class="stat"><b>'+Object.keys(players).length+'</b><span>Players</span></div><div class="stat"><b>'+fmtPM(best)+'</b><span>Course best</span></div></div>';
    html+='<div class="seg"><button data-mode="all" class="'+(boardMode==='all'?'on':'')+'">All rounds</button><button data-mode="best" class="'+(boardMode==='best'?'on':'')+'">Best per player</button></div>';
    var list=rounds.slice();
    if(boardMode==='best'){
      var m={}; list.forEach(function(r){ var k=r.name.toLowerCase(); if(!m[k]||r.toPar<m[k].toPar||(r.toPar===m[k].toPar&&r.date<m[k].date)) m[k]=r; });
      list=Object.keys(m).map(function(k){return m[k];});
    }
    list.sort(function(a,b){ return a.toPar-b.toPar || byDate(a,b); });
    var rank=0, prev=null;
    html+='<div class="lb">'+list.map(function(r,i){
      if(r.toPar!==prev){ rank=i+1; prev=r.toPar; }
      var open=openId===r.id;
      var s='<button class="lbr'+(open?' open':'')+'" data-open="'+esc(r.id)+'"><span class="rank">'+rank+'</span><span class="nm">'+esc(r.name)+'<span class="dt">'+fmtDate(r.date)+'</span></span><span class="sc pm '+pmClass(r.toPar)+'">'+fmtPM(r.toPar)+'</span><span class="chev">\u203a</span></button>';
      if(open){
        var loc=isLocal(r.id);
        var label=loc?(LIVE?'Waiting to sync':'Saved on this device'):(LIVE?'Live leaderboard':'From the shared leaderboard');
        var canDel=loc||LIVE;
        var delTxt=loc?(confirmDel===r.id?'Tap again to delete':'Delete'):(pinFor===r.id?'Cancel':'Delete');
        s+='<div class="detail"><div class="meta">'+fmtDate(r.date)+(r.club?' \u00b7 '+esc(r.club):'')+' \u00b7 '+sumScores(r.scores)+' strokes</div>'+detailTable(r)+
          '<div class="acts"><span>'+label+'</span>'+(canDel?'<button class="btn danger" data-del="'+esc(r.id)+'" style="padding:6px 12px;font-size:13px">'+delTxt+'</button>':'')+'</div>'+
          (!loc&&pinFor===r.id?'<div class="row" style="margin-top:10px"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="Admin PIN" value="'+esc(adminPin)+'"><button class="btn danger fit" data-delgo="'+esc(r.id)+'">Confirm</button></div>':'')+
          '</div>';
      }
      return s;
    }).join('')+'</div>';
  }
  if(!LIVE) html+='<div class="card" style="margin-top:16px"><label class="small">Share the leaderboard</label><p style="margin:4px 0 12px;font-size:14px">Rounds save to this device. Export to merge them into the repo\u2019s <code>rounds.json</code> so everyone sees the same board.</p>'+
    '<div class="row"><button class="btn ghost" id="exp">Export</button><button class="btn ghost" id="imp">Import</button></div><input type="file" id="impf" accept="application/json" class="hidden"></div>';
  return html;
}

/* ---------- Render + events ---------- */
var app=document.getElementById('app');
function render(){
  app.innerHTML = tab==='guide'?viewGuide(): tab==='board'?viewBoard(): viewPlay();
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on',b.dataset.tab===tab); });
}
document.querySelector('nav').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; tab=b.dataset.tab; pinFor=null; window.scrollTo(0,0); render();
  if(tab==='board' && LIVE) syncNow();
});
app.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  if(t.dataset.del===undefined) confirmDel=null;
  if(t.id!=='clearD') confirmClear=false;
  if(t.id!=='saveR') confirmPartial=false;
  if(t.dataset.jump){ var jt=document.getElementById(t.dataset.jump); if(jt) jt.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.dataset.goto){ tab=t.dataset.goto; window.scrollTo(0,0); render(); return; }
  if(t.dataset.cell){ var cp=t.dataset.cell.split(','); draft.hole=+cp[1]; persistDraft(); render(); var rows=document.querySelectorAll('.prow'); if(rows[+cp[0]]) rows[+cp[0]].scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(t.id==='addp'){ var i=document.getElementById('pn'); addPlayer(i.value); var n=document.getElementById('pn'); if(n) n.focus(); return; }
  if(t.dataset.rm!==undefined){ draft.players.splice(+t.dataset.rm,1); persistDraft(); render(); return; }
  if(t.dataset.hole!==undefined){ draft.hole=+t.dataset.hole; persistDraft(); render(); return; }
  if(t.dataset.p!==undefined){ bump(+t.dataset.p,1); return; }
  if(t.dataset.m!==undefined){ bump(+t.dataset.m,-1); return; }
  if(t.id==='prev'){ draft.hole=Math.max(0,draft.hole-1); persistDraft(); render(); return; }
  if(t.id==='next'){ draft.hole=Math.min(HOLES.length-1,draft.hole+1); persistDraft(); render(); return; }
  if(t.id==='saveR'){ saveRound(); return; }
  if(t.id==='clearD'){ if(!confirmClear){ confirmClear=true; render(); return; } confirmClear=false; draft=newDraft(); persistDraft(); render(); return; }
  if(t.dataset.mode){ boardMode=t.dataset.mode; openId=null; render(); return; }
  if(t.dataset.open){ openId=(openId===t.dataset.open)?null:t.dataset.open; pinFor=null; render(); return; }
  if(t.dataset.delgo){ deleteRemote(t.dataset.delgo); return; }
  if(t.dataset.del){
    var did=t.dataset.del;
    if(isLocal(did)){ deleteRound(did); }
    else { pinFor=(pinFor===did)?null:did; render(); var pi=document.getElementById('pinIn'); if(pi) pi.focus(); }
    return;
  }
  if(t.id==='exp'){ exportRounds(); return; }
  if(t.id==='imp'){ document.getElementById('impf').click(); return; }
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dt'&&t.value){ draft.date=t.value; persistDraft(); }
  else if(t.dataset.club!==undefined){ draft.players[+t.dataset.club].club=t.value; persistDraft(); }
  else if(t.id==='impf'&&t.files[0]){ importRounds(t.files[0]); }
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='pinIn'){ e.preventDefault(); if(pinFor) deleteRemote(pinFor); return; }
  if(e.key==='Enter'&&e.target.id==='pn'){ e.preventDefault(); addPlayer(e.target.value); var n=document.getElementById('pn'); if(n) n.focus(); }
});

var toastT;
function toast(msg){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d);
  clearTimeout(toastT); toastT=setTimeout(function(){d.remove();},2600);
}

render();
if(LIVE){
  syncNow();
  setInterval(function(){ if(!document.hidden && tab==='board') syncNow(); },15000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) syncNow(); });
  window.addEventListener('online',syncNow);
} else { loadShared(); }
})();
</script>
</body>
</html>
